<div id="hookah-calc">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

#hookah-calc {
  font-family: 'Inter', sans-serif;
  background: #0E0E0E;
  color: #fff;
  padding: 0;
  margin: 0;
  box-sizing: border-box;
}
#hookah-calc *, #hookah-calc *::before, #hookah-calc *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

.hc-wrapper {
  display: flex;
  max-width: 1200px;
  margin: 0 auto;
  min-height: 500px;
}

.hc-photo {
  flex: 0 0 50%;
  background: url('https://static.tildacdn.com/tild3665-3061-4632-b937-636630323761/image_58_1.png') center/cover no-repeat;
  min-height: 500px;
}

.hc-content {
  flex: 1;
  display: flex;
  padding: 40px 50px;
  gap: 50px;
}

.hc-form {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 28px;
}

.hc-results {
  flex: 0 0 280px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}

/* Slider field */
.hc-field-label {
  font-size: 15px;
  font-weight: 500;
  color: #ccc;
  margin-bottom: 10px;
}

.hc-slider-value {
  display: inline-block;
  width: 48px;
  height: 36px;
  border: 1px solid #555;
  text-align: center;
  line-height: 36px;
  font-size: 16px;
  font-weight: 600;
  color: #fff;
  background: transparent;
  margin-bottom: 8px;
}

.hc-range {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 3px;
  background: #555;
  outline: none;
  border-radius: 2px;
}
.hc-range::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #CB2A20;
  cursor: pointer;
  border: none;
}
.hc-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #CB2A20;
  cursor: pointer;
  border: none;
}

.hc-range-limits {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: #777;
  margin-top: 6px;
}

/* Location */
.hc-location-title {
  font-size: 15px;
  font-weight: 500;
  color: #ccc;
  margin-bottom: 4px;
}
.hc-location-hint {
  font-size: 12px;
  color: #777;
  margin-bottom: 12px;
}

.hc-radio-group {
  display: flex;
  gap: 30px;
}
.hc-radio-label {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  font-size: 14px;
  color: #ccc;
}
.hc-radio-label input[type="radio"] {
  display: none;
}
.hc-radio-circle {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 2px solid #CB2A20;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.hc-radio-label input[type="radio"]:checked + .hc-radio-circle::after {
  content: '';
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #CB2A20;
}

/* Results */
.hc-result-label {
  font-size: 16px;
  font-weight: 500;
  color: #ccc;
  margin-bottom: 8px;
}
.hc-result-price {
  font-size: 36px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 16px;
}

.hc-btn {
  display: block;
  width: 100%;
  height: 45px;
  line-height: 45px;
  padding: 0;
  background: #CB2A20;
  color: #FFFFFF;
  text-align: center;
  text-decoration: none;
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  font-weight: 600;
  border: none;
  border-radius: 0;
  cursor: pointer;
  transition: background 0.2s;
}
.hc-btn:hover {
  background: #a82219;
}

/* Responsive */
@media (max-width: 1024px) {
  .hc-content {
    flex-direction: column;
    padding: 30px;
    gap: 30px;
  }
  .hc-results {
    flex: none;
  }
}

@media (max-width: 768px) {
  .hc-wrapper {
    flex-direction: column-reverse;
  }
  .hc-photo {
    flex: none;
    min-height: 300px;
    order: 2;
  }
  .hc-content {
    order: 1;
    padding: 24px 15px;
    gap: 24px;
  }
  .hc-form {
    gap: 22px;
  }
  .hc-result-price {
    font-size: 28px;
  }
}
</style>

<div class="hc-wrapper">
  <div class="hc-photo"></div>

  <div class="hc-content">
    <div class="hc-form">
      <!-- Количество гостей -->
      <div>
        <div class="hc-field-label">Количество гостей</div>
        <div class="hc-slider-value" id="hc-guests-val">10</div>
        <input type="range" class="hc-range" id="hc-guests" min="1" max="15" value="10">
        <div class="hc-range-limits"><span>1</span><span>15</span></div>
      </div>

      <!-- Продолжительность мероприятия -->
      <div>
        <div class="hc-field-label">Продолжительность мероприятия</div>
        <div class="hc-slider-value" id="hc-hours-val">3</div>
        <input type="range" class="hc-range" id="hc-hours" min="1" max="12" value="3">
        <div class="hc-range-limits"><span>1</span><span>12</span></div>
      </div>

      <!-- Где будет мероприятие -->
      <div>
        <div class="hc-location-title">Где будет мероприятие?</div>
        <div class="hc-location-hint">Выезд по Москве бесплатно, за МКАД — рассчитывается отдельно</div>
        <div class="hc-radio-group">
          <label class="hc-radio-label">
            <input type="radio" name="hc-location" value="moscow" checked>
            <span class="hc-radio-circle"></span>
            Москва
          </label>
          <label class="hc-radio-label">
            <input type="radio" name="hc-location" value="region">
            <span class="hc-radio-circle"></span>
            Московская область
          </label>
        </div>
      </div>
    </div>

    <div class="hc-results">
      <div>
        <div class="hc-result-label">Предварительная стоимость:</div>
        <div class="hc-result-price" id="hc-price">21 000 ₽</div>
      </div>
      <a href="#popup:myform" class="hc-btn">Оставить заявку</a>
    </div>
  </div>
</div>

<script>
(function(){
  var guests = document.getElementById('hc-guests');
  var hours = document.getElementById('hc-hours');
  var guestsVal = document.getElementById('hc-guests-val');
  var hoursVal = document.getElementById('hc-hours-val');
  var priceEl = document.getElementById('hc-price');

  function fmt(n) {
    return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  }

  function calc() {
    var g = parseInt(guests.value);
    var h = parseInt(hours.value);
    guestsVal.textContent = g;
    hoursVal.textContent = h;

    var hookahs = Math.ceil(g / 3);
    var served = h * hookahs;
    var total = served * 2100;

    priceEl.textContent = fmt(total) + ' ₽';
  }

  guests.addEventListener('input', calc);
  hours.addEventListener('input', calc);
  calc();
})();
</script>
</div>
